<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="#0f172a" opacity="0.08"/>
  <!-- upward trend line -->
  <polyline points="120,352 210,262 292,312 392,176"
            fill="none" stroke="#ffffff" stroke-width="30"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrow head -->
  <polyline points="330,176 392,176 392,238"
            fill="none" stroke="#ffffff" stroke-width="30"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- data dots -->
  <circle cx="120" cy="352" r="20" fill="#ffffff"/>
  <circle cx="210" cy="262" r="20" fill="#ffffff"/>
  <circle cx="292" cy="312" r="20" fill="#ffffff"/>
</svg>
